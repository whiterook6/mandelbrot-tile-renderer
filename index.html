<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tile-renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="canvas-stack">
      <canvas id="tile-canvas-back"></canvas>
      <canvas id="tile-canvas"></canvas>
    </div>
    <div id="bottom-bar">
      <div id="view-controls">
        <span id="view-x"></span>
        <span id="view-y"></span>
        <span id="view-zoom"></span>
        <span id="view-rotation"></span>
        <button id="reset-view" type="button">Home</button>
      </div>
      <div id="action-controls">
        <button id="take-snapshot" type="button">Snapshot</button>
      </div>
      <div id="progress">
        <span id="queue-count">0</span>
      </div>
      <div id="settings">
        <div id="gradient-controls">
          <select id="gradient-select" value="Rainbow"></select>
        </div>
        <div id="gradient-preview"></div>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
